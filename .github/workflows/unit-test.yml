name: test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "tester/*"]
  pull_request:
    branches: ["main"]

jobs:
  test-package:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        name: [
          "ubuntu-python-3-10",
          "ubuntu-python-3-11",
          "ubuntu-python-3-12",
          "ubuntu-python-3-13",

          "macos-python-3-10",
          "macos-python-3-11",
          "macos-python-3-12",
          "macos-python-3-13"
        ]

        include:
          - name: "ubuntu-python-3-10"
            python-version: "3.10"
            os: ubuntu-latest
          - name: "ubuntu-python-3-11"
            python-version: "3.11"
            os: ubuntu-latest
          - name: "ubuntu-python-3-12"
            python-version: "3.12"
            os: ubuntu-latest
          - name: "ubuntu-python-3-13"
            python-version: "3.13"
            os: ubuntu-latest

          - name: "macos-python-3-10"
            python-version: "3.10"
            os: macos-latest
          - name: "macos-python-3-11"
            python-version: "3.11"
            os: macos-latest
          - name: "macos-python-3-12"
            python-version: "3.12"
            os: macos-latest
          - name: "macos-python-3-13"
            python-version: "3.13"
            os: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: make install-uv
    - name: Create virtual environment
      run: uv venv --python=python
    - name: Install local package
      run: make install-local-package
    - name: Test package
      run: make test
