name: type-check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "tester/*"]
  pull_request:
    branches: ["main"]

jobs:
  type-check:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        name: [
          "ubuntu-python-3-10",
          "ubuntu-python-3-11",
          "ubuntu-python-3-12",
          "ubuntu-python-3-13"
        ]

        include:
          - name: "ubuntu-python-3-10"
            python-version: "3.10"
            os: ubuntu-latest
          - name: "ubuntu-python-3-11"
            python-version: "3.11"
            os: ubuntu-latest
          - name: "ubuntu-python-3-12"
            python-version: "3.12"
            os: ubuntu-latest
          - name: "ubuntu-python-3-13"
            python-version: "3.13"
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set Up Python ${{ matrix.pytohn-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: make install-uv
    - name: Create virtual environment
      run: uv venv --python=python
    - name: Install local package
      run: make install-local-package
    - name: Install type-checker
      run: make install-linter
    - name: Type-check
      run: make type-check
